services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: ufeel
      POSTGRES_USER: ufeel
      POSTGRES_PASSWORD: ufeel_dev_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufeel -d ufeel"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: UFEEL
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ufeel
      DB_USERNAME: ufeel
      DB_PASSWORD: ufeel_dev_pass
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      FILAMENT_FILESYSTEM_DISK: public
    command: ["sh", "-ec", "
      mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache &&
      chmod -R 775 storage bootstrap/cache &&
      php artisan storage:link --force || true &&
      php artisan migrate --force &&
      php artisan db:seed --class=AdminSeeder --force &&
      php artisan db:seed --class=SiteStatSeeder --force &&
      exec php artisan serve --host=0.0.0.0 --port=3000 --no-reload
    "]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
